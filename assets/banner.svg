<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Stealth Escape AI Game banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#141427"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a3a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.7"/>

  <!-- Simple "map" strip -->
  <g opacity="0.95" transform="translate(70,175)">
    <rect x="0" y="0" width="520" height="90" rx="10" fill="#0f1018" stroke="#34344a"/>

    <!-- Walls -->
    <g fill="#3c3c46">
      <rect x="20" y="20" width="40" height="40" rx="6"/>
      <rect x="60" y="20" width="40" height="40" rx="6"/>
      <rect x="100" y="20" width="40" height="40" rx="6"/>
      <rect x="180" y="20" width="40" height="40" rx="6"/>
      <rect x="260" y="20" width="40" height="40" rx="6"/>
      <rect x="260" y="60" width="40" height="20" rx="6"/>
      <rect x="340" y="20" width="40" height="40" rx="6"/>
      <rect x="380" y="20" width="40" height="40" rx="6"/>
      <rect x="420" y="20" width="40" height="40" rx="6"/>
    </g>

    <!-- Player (P) -->
    <g transform="translate(120,60)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#50c8ff"/>
      <path d="M 13 6 L 13 20" stroke="#0c0c0e" stroke-width="3"/>
      <path d="M 13 13 L 21 13" stroke="#0c0c0e" stroke-width="3"/>
    </g>

    <!-- Guard (G) -->
    <g transform="translate(210,60)">
      <rect x="0" y="0" width="26" height="26" rx="7" fill="#ff5050"/>
      <path d="M 13 6 L 13 20" stroke="#0c0c0e" stroke-width="3"/>
      <path d="M 13 13 L 5 13" stroke="#0c0c0e" stroke-width="3"/>
    </g>

    <!-- Vision cone -->
    <path d="M 223 72 L 290 52 L 290 92 Z" fill="#3264ff" opacity="0.25"/>

    <!-- Key (K) -->
    <g transform="translate(455,60)">
      <circle cx="10" cy="13" r="7" fill="#ffdc46"/>
      <rect x="16" y="12" width="18" height="3" rx="2" fill="#ffdc46"/>
      <rect x="26" y="10" width="3" height="7" rx="1" fill="#ffdc46"/>
    </g>

    <!-- Exit (E) -->
    <g transform="translate(490,50)">
      <rect x="0" y="0" width="18" height="40" rx="5" fill="#28c878"/>
      <rect x="4" y="18" width="10" height="4" rx="2" fill="#0c0c0e" opacity="0.6"/>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(70,70)">
    <text x="0" y="0" fill="#f0f0fa" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Stealth Escape AI Game</text>
    <text x="0" y="34" fill="#c8c8d6" font-family="Segoe UI, Arial, sans-serif" font-size="18">Grid stealth + pursuit • BFS / A* / BiBFS / Greedy / Weighted A* • FOV + line-of-sight</text>
  </g>

  <!-- Accent tag -->
  <g transform="translate(935,58)">
    <rect x="0" y="0" width="195" height="34" rx="10" fill="#0f1018" stroke="#34344a"/>
    <text x="98" y="22" text-anchor="middle" fill="#ffdc46" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">AI COURSE PROJECT</text>
  </g>
</svg>
